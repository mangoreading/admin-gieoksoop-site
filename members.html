<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원관리 — 기억숲 Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell" id="adminRoot"></div>

<script type="module">
  import { guardAdminPage, db, toast, escapeHtml } from './js/admin-guard.js';
  import { createMemberDetail } from './js/member-detail.js';
  import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

  const { user: adminUser } = await guardAdminPage({
    activeKey: 'members',
    title: '회원관리',
    desc: '가입한 회원 목록을 확인하고, 필요하면 구독 상태를 수동으로 조정할 수 있어요.',
  });
  const adminLabel = adminUser.email || adminUser.uid;

  const content = document.getElementById('adminContent');
  content.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div class="toolbar">
          <input type="search" id="searchInput" placeholder="이름 또는 이메일로 검색">
          <select id="statusFilter">
            <option value="">구독상태: 전체</option>
            <option value="active">구독중</option>
            <option value="canceled">해지</option>
            <option value="none">미구독</option>
          </select>
          <select id="planFilter">
            <option value="">플랜: 전체</option>
            <option value="monthly">월간</option>
            <option value="annual">연간</option>
            <option value="other">기타/없음</option>
          </select>
        </div>
        <span class="muted" id="countLabel"></span>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th>이름</th><th>이메일</th><th>가입일</th><th>구독상태</th><th>플랜</th><th>다음 결제일</th><th>계정상태</th><th></th></tr></thead>
          <tbody id="tbody"><tr><td colspan="8" class="empty-row">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  const tbody = document.getElementById('tbody');
  const countLabel = document.getElementById('countLabel');
  const searchInput = document.getElementById('searchInput');
  const statusFilter = document.getElementById('statusFilter');
  const planFilter = document.getElementById('planFilter');

  function fmtDate(ts) {
    if (!ts || !ts.toDate) return '-';
    const d = ts.toDate();
    return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
  }

  function statusPill(status) {
    if (status === 'active') return '<span class="pill pill-ok">구독중</span>';
    if (status === 'canceled') return '<span class="pill pill-danger">해지</span>';
    return '<span class="pill pill-muted">미구독</span>';
  }

  let allUsers = [];

  const { openDetail } = createMemberDetail({ adminLabel, getUsers: () => allUsers, onChange: () => render(filterList()) });

  function render(list) {
    countLabel.textContent = `${list.length.toLocaleString()}명`;
    if (list.length === 0) {
      tbody.innerHTML = `<tr><td colspan="8" class="empty-row">검색 결과가 없어요.</td></tr>`;
      return;
    }
    tbody.innerHTML = list
      .map(
        (u) => `
      <tr>
        <td>${escapeHtml(u.name || '-')}</td>
        <td>${escapeHtml(u.email || '-')}</td>
        <td class="muted">${fmtDate(u.created_at)}</td>
        <td>${statusPill(u.subscription_status)}</td>
        <td class="muted">${escapeHtml(u.subscription_plan || '-')}</td>
        <td class="muted">${u.next_billing_at ? fmtDate(u.next_billing_at) : '-'}</td>
        <td>${u.suspended ? '<span class="pill pill-danger">일시중지</span>' : '<span class="pill pill-ok">정상</span>'}</td>
        <td><button class="btn btn-outline btn-sm" data-detail="${u.id}">상세</button></td>
      </tr>`
      )
      .join('');

    tbody.querySelectorAll('[data-detail]').forEach((btn) => {
      btn.addEventListener('click', () => openDetail(btn.getAttribute('data-detail')));
    });
  }

  // 검색어 + 구독상태 + 플랜 조건을 모두 만족하는 회원만 남긴다.
  function filterList() {
    const needle = (searchInput.value || '').trim().toLowerCase();
    const statusQ = statusFilter.value;
    const planQ = planFilter.value;
    return allUsers.filter((u) => {
      if (needle && !((u.name || '').toLowerCase().includes(needle) || (u.email || '').toLowerCase().includes(needle))) return false;
      if (statusQ && (u.subscription_status || 'none') !== statusQ) return false;
      if (planQ) {
        const plan = u.subscription_plan === 'monthly' || u.subscription_plan === 'annual' ? u.subscription_plan : 'other';
        if (plan !== planQ) return false;
      }
      return true;
    });
  }

  searchInput.addEventListener('input', () => render(filterList()));
  statusFilter.addEventListener('change', () => render(filterList()));
  planFilter.addEventListener('change', () => render(filterList()));

  try {
    const snap = await getDocs(collection(db, 'users'));
    allUsers = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => {
        const ta = a.created_at && a.created_at.toDate ? a.created_at.toDate().getTime() : 0;
        const tb = b.created_at && b.created_at.toDate ? b.created_at.toDate().getTime() : 0;
        return tb - ta;
      });
    render(allUsers);
    // 다른 화면(구독결제 관리 등)에서 ?uid=... 로 들어오면 그 회원의 상세 팝업을 바로 연다.
    const openUid = new URLSearchParams(location.search).get('uid');
    if (openUid) {
      if (allUsers.some((x) => x.id === openUid)) openDetail(openUid);
      else toast('해당 회원을 찾지 못했어요.', true);
    }
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-row">불러오지 못했어요: ${escapeHtml(e.message || String(e))}</td></tr>`;
  }
</script>

</body>
</html>
