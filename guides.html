  const content = document.getElementById('adminContent');
  content.innerHTML = `
    <div class="panel" id="seedBanner" style="display:none;">
      <div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <strong>아직 등록된 가이드가 없어요.</strong>
          <p class="form-hint" style="margin-top:4px;">준비된 기본 가이드(19개 섹션)를 그대로 불러와서 시작할 수 있어요.</p>
        </div>
        <button class="btn btn-primary btn-sm" id="seedBtn">기존 콘텐츠 불러오기</button>

    <div class="panel">
      <div class="panel-head">
        <div><h2>섹션 목록</h2><p>≡ 손잡이를 드래그해서 순서를 바꿀 수 있어요. 공개 페이지에는 이 순서대로, 게시중인 섹션만 보여요.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" id="syncBtn" title="코드에 준비된 최신 기본 가이드를 이미 등록된 섹션에 반영해요">최신 기본 내용 반영</button>
          <button class="btn btn-primary btn-sm" id="addBtn">+ 새 섹션</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="data-table">
          <thead><tr><th style="width:90px;">순서</th><th>제목</th><th>배지</th><th>앵커(#id)</th><th>게시상태</th><th></th></tr></thead>
          <tbody id="tbody"><tr><td colspan="6" class="empty-row">불러오는 중...</td></tr></tbody>
        </table>
      </div>
    </div>
  `;

  const tbody = document.getElementById('tbody');
  const seedBanner = document.getElementById('seedBanner');

  // 현재 공개 사이트(guide.html)에 이미 있는 9개 섹션 — 최초 1회 불러오기용 시드 데이터.
  // guide.html의 정적 콘텐츠와 100% 동일한 문구를 유지한다.
  const SEED_SECTIONS = [
    {"anchor_id": "need", "title": "시작 전 준비물 — 이것만 있으면 돼요", "badge": "필독", "body": "기억숲을 쓰기 위해 필요한 것을 먼저 정리했어요. 대부분은 이미 가지고 계신 것들이에요.\n\n① 컴퓨터 (필수)\n· Windows 10 이상, 또는 macOS 12 이상(맥·아이맥) 컴퓨터가 필요해요.\n· 기억숲은 사진을 인터넷에 올려 쓰는 서비스가 아니라, 내 컴퓨터에 설치해서 쓰는 PC 앱이에요. 스마트폰만으로는 쓸 수 없고, 폰에 있는 사진은 PC로 옮겨서 정리해요.\n· 사진·영상이 많을수록 처음 정리(스캔)에 시간이 걸려요. 화면에 보여줄 작은 미리보기(썸네일)와 인물 인식 결과가 컴퓨터에 저장되니, 저장 공간에도 약간의 여유가 있으면 좋아요.\n\n② 정리할 사진·영상 원본 (필수)\n· 사진·영상이 이 컴퓨터의 폴더, 또는 연결된 외장하드·USB의 폴더에 들어 있어야 해요. 기억숲은 그 폴더를 읽어서 정리만 하고, 파일을 옮기거나 복사하거나 수정하지 않아요.\n· 폰이나 카메라에 있는 사진은 케이블이나 클라우드로 PC 폴더에 먼저 모아 두거나, 기억숲의 \"폰에서 사진 가져오기\"(QR코드)를 쓰면 돼요.\n· 일반적인 사진(JPG, PNG, 아이폰 HEIC 등)과 동영상을 읽을 수 있어요.\n· 사진에 촬영 날짜(EXIF)가 남아 있을수록 시간순 정리가 정확해져요. 카톡·메신저로 주고받은 사진은 날짜·위치 정보가 지워져 있을 수 있어요. 이럴 땐 \"위치 기록 가져오기\"나 사진별 날짜 수정으로 보완할 수 있어요.\n\n③ 기억숲 계정 (무료 가입)\n· 기억숲 홈페이지(gieoksoop.com)에서 이메일로 회원가입을 해요. 가입은 무료예요.\n· 앱 안에서 로그인(설정 > 계정)하면 구독 상태 확인과 인생챕터 외부공유를 쓸 수 있어요. 사진 폴더 연결, 자동 이벤트 정리, 인물 인식 같은 무료 기능은 구독 없이 쓸 수 있어요.\n\n④ 인터넷 연결 (일부 기능에만)\n· 사진 정리와 인물 인식은 인터넷 없이 컴퓨터 안에서 처리돼요.\n· 인터넷이 필요한 때: 로그인과 구독 상태 확인, 사진 좌표로 장소 이름 찾기(좌표만 OpenStreetMap에 전달돼요), AI 글 다듬기·초안(선택), 인생챕터 외부공유, 그리고 익명 오류·이용 통계 전송이에요.\n\n⑤ 선택 준비물\n· 폰에서 사진 가져오기: 아이폰·안드로이드의 브라우저(Safari, 크롬 등)와, PC와 같은 와이파이.\n· 위치 기록 가져오기: 구글 지도 \"타임라인\" 데이터를 내보낸 .json 파일.\n· 외부공유·무제한 사용: 구독(월 3,000원 / 연 28,000원). 구독하지 않아도 핵심 기능은 계속 무료예요."},
    {"anchor_id": "install", "title": "설치하고 처음 실행하기", "badge": "", "body": "1. 기억숲 홈페이지에서 무료로 회원가입해요.\n\n2. 다운로드 페이지에서 내 컴퓨터에 맞는 버전(Windows 10 이상 / macOS 12 이상)을 받아 설치해요. 지금은 출시를 준비 중이라, 가입해 두시면 다운로드가 준비되는 대로 가입하신 이메일로 가장 먼저 안내드려요.\n\n3. 설치가 끝나면 기억숲을 실행해요. 처음에는 \"사진 폴더를 선택해서 시작하세요\" 화면이 나와요. 다음 항목(시작하기 — 사진 폴더 연결)으로 이어서 진행하면 돼요.\n\n4. 이미 쓰던 컴퓨터에서 새 컴퓨터로 옮기는 경우에는 \"컴퓨터를 바꿀 때 — 내보내기·가져오기\" 항목을 먼저 확인해 주세요.\n\n기억숲 앱은 이 컴퓨터 안에서만 동작해요. 앱을 닫으면 정리된 결과는 컴퓨터에 그대로 남아 있고, 다음에 켜면 다시 스캔하지 않아도 바로 이어서 볼 수 있어요."},
    {"anchor_id": "start", "title": "시작하기 — 사진 폴더 연결", "badge": "", "body": "기억숲을 처음 실행하면 사진·영상이 들어 있는 폴더(내 컴퓨터의 폴더, 외장하드 등)를 연결하는 화면이 나와요. 사진 파일은 옮기거나 복사되지 않고, 그 자리에 그대로 둔 채 기억숲이 분석만 합니다.\n\n1. \"사진 폴더 경로\"에 폴더 위치를 입력해요. 하위 폴더까지 전부 스캔하니, 사진이 연도별로 나뉘어 있어도 상위 폴더 하나만 고르면 돼요.\n2. \"인물 인식 포함\"은 같은 사람이 나온 사진을 자동으로 묶어 주는 기능이에요(기본으로 켜져 있어요). 사진이 많으면 몇 분 더 걸릴 수 있고, 나중에 설정에서 다시 실행할 수도 있어요.\n3. \"스캔 시작\"을 누르면 진행 상황(%)이 표시돼요. 처음 스캔은 사진 양에 따라 시간이 걸리니, 끝날 때까지 창을 닫지 말고 기다려 주세요.\n\n스캔이 끝나면 촬영 날짜(EXIF)·위치(GPS)·얼굴 정보를 바탕으로 사진들이 사건(이벤트) 단위로 자동 정리돼요. 폴더를 더 연결하고 싶다면 시작한 뒤 설정에서 얼마든지 추가할 수 있어요."},
    {"anchor_id": "home", "title": "홈 — 오늘의 기억", "badge": "", "body": "홈 화면은 기억숲의 입구예요. 켤 때마다 조금씩 다른 기억을 만나게 돼요.\n\n· 그날의 기억: \"오늘 같은 날\" 찍은 과거의 사진(온 디스 데이)을 보여줘요.\n· 인생 전체 보기: 칸 하나가 한 달인 달력 모양의 라이프 그리드예요. 사진이 있는 달만 채워져서 내 기록이 남아 있는 시기를 한눈에 알 수 있어요. 달 칸을 누르면 그 달의 달력으로 이동해요.\n· 인생챕터 영상: 만들어 둔 인생챕터를 짧은 트레일러 영상으로 바로 볼 수 있어요.\n· 지도에서 보기: 사진이 찍힌 장소를 지도 위에서 볼 수 있어요."},
    {"anchor_id": "timeline", "title": "앨범 보기 · 타임라인", "badge": "", "body": "· 앨범 보기: 사진·영상을 격자 형태로 쭉 훑어보는 화면이에요. 아래로 내리면 더 불러와요.\n\n· 타임라인: 사진을 시간순으로, 이벤트(사건) 단위로 묶어서 보여줘요. 연도·장소·함께한 사람이 한눈에 들어와요.\n\n두 화면 모두에서 사진 한 장을 누르면 크게 볼 수 있고, 날짜를 수정하거나 캡션을 남길 수 있어요. \"여러 장 선택\"을 누르면 여러 장을 한꺼번에 골라 휴지통으로 옮길 수 있어요. 마음에 드는 사진은 별 아이콘으로 즐겨찾기에 추가해 보세요."},
    {"anchor_id": "people", "title": "인물", "badge": "", "body": "얼굴 인식으로 사진 속 인물들을 자동으로 그룹화해요. 이 과정은 전부 내 컴퓨터 안에서 이뤄지고, 얼굴 데이터는 밖으로 나가지 않아요.\n\n· 이름 붙이기: 인물에 이름을 붙이면 사진 속 사람들이 누구인지 한눈에 보이고, 검색과 인생챕터의 \"참석자\"에도 활용돼요. 엄마·아빠 같은 관계로 불러도 좋아요.\n· 같은 인물 합치기: 같은 사람인데 다른 그룹으로 나뉘었다면, 해당 인물들을 선택해서 \"합치기\"를 눌러요. \"합치기 추천\"에서는 기억숲이 같은 사람일 것 같은 그룹을 제안해 주니, 맞으면 합치고 아니면 거절하세요.\n· 숨기기: 모르는 사람이나 배경 속 행인처럼 정리하고 싶지 않은 인물은 숨길 수 있어요. 숨긴 인물은 \"숨긴 인물\"에서 다시 꺼낼 수 있어요.\n\n인물이 하나도 보이지 않는다면 설정에서 \"인물 인식 전체 실행\"을 눌러 보세요."},
    {"anchor_id": "chapters", "title": "인생 챕터 만들기", "badge": "", "body": "인생 챕터는 특별했던 순간들을 한 편의 이야기로 엮은 기록이에요.\n\n[만드는 방법]\n1. 인생 챕터 화면에서 \"+ 새 인생챕터 만들기\"를 눌러요.\n2. 타임라인의 이벤트 중에서 챕터로 만들 순간을 골라요(최근 순으로 보여줘요).\n3. 챕터 상세 화면에서 내용을 다듬어요.\n\n[챕터 상세 화면에서 할 수 있는 일]\n· 제목, 날짜, 장소, 참석자, 이야기(본문)를 직접 쓰고 수정해요. \"기본 정보로 채우기\"를 누르면 이벤트의 날짜·장소·참석자가 자동으로 들어가요.\n· \"✨ AI가 글 다듬기\": 내가 쓴 이야기를 AI가 다듬어 주고, 마음에 들면 \"이걸로 바꾸기\"를 눌러야 실제로 반영돼요. 마음에 안 들면 \"닫기\"로 원문을 그대로 둘 수 있어요. AI 기능은 선택이고, 쓰지 않아도 모든 기능을 직접 써서 똑같이 완성할 수 있어요.\n· 사진 고르기: 사진을 드래그해 순서를 바꾸고, 오른쪽 위 ×로 챕터에서 뺄 수 있어요. 사진이 많으면 \"여러 장 선택\"으로 남길 사진만 골라 \"선택한 사진 적용\", 뺄 사진만 골라 \"선택한 사진 빼기\"로 한 번에 처리해요.\n· 완성한 챕터는 PDF로 내보내 인쇄하거나 보관할 수 있어요.\n\nAI 기능을 쓸 때도 사진·영상은 전송되지 않아요. 날짜·장소·참석자 이름·이야기 같은 텍스트만 처리돼요(자세한 내용은 \"내 사진과 개인정보\" 항목을 참고하세요)."},
    {"anchor_id": "video", "title": "인생챕터 영상", "badge": "", "body": "만든 인생챕터를 짧은 트레일러 영상으로 만들어 그 자리에서 바로 볼 수 있어요. 사진이 천천히 확대·이동하는 연출과 분위기에 어울리는 배경음악이 입혀지고, 장면 사이는 자연스러운 크로스페이드로 이어져요. \"화면 전체로 보기\"로 크게 감상할 수 있고, 마음에 들면 mp4 파일로 저장할 수도 있어요.\n\n챕터 보기 화면의 영상 버튼, 또는 홈 화면의 \"인생챕터 영상\"에서 시작해요. 영상 만들기는 시간이 조금 걸리니 진행 화면이 끝날 때까지 기다려 주세요. 영상은 사진을 외부로 보내지 않고, 이 컴퓨터 안에서만 만들어져요."},
    {"anchor_id": "map", "title": "지도에서 보기", "badge": "", "body": "사진에 위치(GPS) 정보가 있으면 지도 위에 사진이 찍힌 장소가 표시돼요. 표시된 사진을 누르면 크게 볼 수 있고, 지도도 \"화면 전체로 보기\"로 넓게 볼 수 있어요.\n\n홈의 \"인생 전체 보기\", 타임라인, 달력, 챕터 보기 화면의 \"지도에서 보기\"로 들어갈 수 있고, 보고 있던 범위의 사진 위치만 보여줘요. 위치 정보가 없는 사진은 지도에 나타나지 않아요. 이런 사진은 아래 \"위치 기록 가져오기\"로 장소를 채울 수 있어요."},
    {"anchor_id": "location", "title": "위치 기록 가져오기 (선택)", "badge": "", "body": "스크린샷이나 카톡으로 받은 사진처럼 GPS가 없는 사진·영상도, 그 시각에 내가 있었던 장소를 자동으로 채워 주는 기능이에요. 타임라인 이벤트도 더 정확하게 나뉘어요.\n\n1. 휴대폰에서 위치 기록(타임라인)을 파일로 내보내요.\n· 안드로이드: 설정 > 위치 > 위치 서비스 > 타임라인 > \"타임라인 데이터 내보내기\"\n· 아이폰: Google 지도 앱 > 프로필 아이콘 > 내 타임라인 > ⋯ 메뉴 > 위치 및 개인정보 설정 > \"타임라인 데이터 내보내기\"\n\n2. 저장된 .json 파일을 컴퓨터로 옮겨요. 카카오톡 \"나에게 보내기\", 이메일, 구글 드라이브 등을 쓰면 편해요.\n\n3. 기억숲 설정 > \"위치 기록 가져오기\"에서 \"가져오기\"로 그 파일을 올려요.\n\n이 파일은 내 컴퓨터에서만 처리돼요. 장소 이름을 찾을 때 좌표만 OpenStreetMap으로 전달되는 것은 GPS가 있는 사진과 같아요. 언제든 \"삭제\"로 지울 수 있어요."},
    {"anchor_id": "search", "title": "검색", "badge": "", "body": "상단의 검색에서 사람 이름이나 관계(엄마, 아빠 등), 지명, 연도(예: 2024), \"6월\" 같은 날짜로 사진을 찾을 수 있어요.\n\n검색 결과가 없다면 인물에 이름이 붙어 있는지, 해당 폴더가 연결되어 스캔이 끝났는지 확인해 보세요."},
    {"anchor_id": "etc", "title": "즐겨찾기 · 휴지통", "badge": "", "body": "· 즐겨찾기: 타임라인이나 사진 확대 화면에서 별 아이콘을 누르면 즐겨찾기에 모여요. 특별히 아끼는 사진만 따로 모아보기 좋아요.\n\n· 휴지통: 타임라인이나 앨범 보기에서 \"여러 장 선택\"으로 사진을 휴지통으로 옮길 수 있어요. 휴지통의 사진은 복원하거나 완전히 지울 수 있고, \"전체 비우기\"로 한꺼번에 정리할 수도 있어요. 휴지통으로 옮기는 것은 기억숲 안에서만 정리되는 것이라, 휴대폰 등 다른 기기에 있는 원본은 전혀 영향받지 않아요."},
    {"anchor_id": "preserve", "title": "영구보존 & 외부공유", "badge": "중요", "body": "기본적으로는 원본 사진이 컴퓨터에 있을 때만 챕터를 볼 수 있어요. 원본이 삭제되거나 외장하드가 연결돼 있지 않으면 그 사진의 미리보기도 함께 보이지 않아요(저장공간을 이중으로 쓰지 않기 위한 기본 동작).\n\n정말 소중한 챕터는 챕터 상세 화면의 \"보존 & 공유\"에서 두 단계로 지킬 수 있어요.\n\n① 로컬 보존: 이 챕터의 사진·영상을 원본과 별도로 기억숲 저장소에 복사해 둬요. 원본이 사라지거나 외장하드가 빠져 있어도 그 챕터는 계속 볼 수 있어요. 필요 없어지면 \"보존 취소\"로 되돌릴 수 있어요.\n\n② 외부 공유: 보존해 둔 사진을 로그인한 계정으로 올려, 가족·지인에게 보낼 수 있는 공유 링크를 만들어요. \"외부공유\"를 누르면 링크가 자동으로 채워지고, \"복사\"로 바로 전달할 수 있어요. 아직 보존 전이어도 알아서 ①까지 함께 처리해 줘요.\n\n알아두세요\n· 외부 공유는 로그인이 필요하고, 구독(유료)에서 쓸 수 있는 기능이에요.\n· 영상은 아직 공유 페이지에서 보여줄 수 없어서, 공유 링크에는 사진만 올라가요.\n· 공유한 사진만 외부에 올라가요. 내가 공유하지 않은 사진·영상은 어디로도 전송되지 않아요."},
    {"anchor_id": "mobile", "title": "폰에서 사진 가져오기", "badge": "", "body": "폰에 있는 사진을 PC로 옮기는 방법이 두 가지 있어요. 어느 쪽이든 폰과 컴퓨터가 같은 와이파이에 있어야 해요.\n\n① QR코드로 가져오기 (무료, 앱 설치 필요 없음)\n1. PC의 기억숲 설정 > \"폰에서 사진 가져오기\"에서 \"QR코드로 가져오기\"를 눌러요.\n2. 폰 카메라로 QR코드를 스캔해요(아이폰·안드로이드의 브라우저가 열려요). QR코드는 20분 뒤 자동으로 만료돼요.\n3. 보낼 사진·영상을 고르면 바로 PC로 전송이 시작돼요. 더 보낼 사진이 있으면 이어서 보낼 수 있어요.\n보낸 사진은 자동으로 스캔·인물 인식까지 돼서 잠시 후 타임라인에 반영돼요. 따로 만질 설정은 없어요.\n\n② 폰 자동 동기화 (구독)\n폰에 기억숲 동기화 앱을 한 번 연결해 두면, 그 뒤로는 같은 와이파이에 있을 때마다 새 사진이 자동으로 PC에 들어와요. 설정의 \"새 폰 연결하기\"로 시작하고, 폰에서 연결을 요청하면 PC 화면에서 \"연결 허용\"을 눌러 주세요. QR 방식과 따로 동작해서 둘 다 써도 돼요."},
    {"anchor_id": "backup", "title": "컴퓨터를 바꿀 때 — 내보내기·가져오기", "badge": "", "body": "컴퓨터를 바꿀 때 챕터와 인물 인식 결과를 그대로 옮기는 기능이에요.\n\n파일에 들어 있는 것: 인생챕터(제목·이야기·즐겨찾기), 인물 인식 결과(이름·얼굴 썸네일), 로컬 보존해 둔 챕터의 사진·영상 사본.\n파일에 들어 있지 않은 것: 사진·영상 원본. 원본은 직접 새 컴퓨터나 외장하드로 옮겨 주세요.\n\n1. 이전 컴퓨터의 설정 > \"기억숲 파일 내보내기 / 가져오기\"에서 \"내보내기\"를 눌러 zip 파일을 저장해요. 저장 위치는 직접 고를 수 있어요.\n2. 새 컴퓨터에 기억숲을 설치하고, 사진·영상 원본 폴더도 같은 폴더 구조로 옮겨 연결해요.\n3. \"가져오기\"에서 그 zip을 선택하면 챕터와 인물 인식 결과가 복원돼요. 보존해 둔 챕터는 원본을 못 찾아도 파일 안의 사본으로 그대로 보여요.\n\n이 파일에는 얼굴 인식 썸네일이 포함되어 있어요. 다른 사람에게 전달하지 않도록 주의해 주세요. 정기적으로 내보내기를 해 두면 백업으로도 쓸 수 있어요."},
    {"anchor_id": "settings", "title": "설정", "badge": "", "body": "· 계정: 기억숲 웹서비스에 로그인·로그아웃해요. \"로그인\"을 누르면 브라우저 창이 열리고, 거기서 로그인을 마치면 자동으로 앱에 연결돼요.\n\n· 사진 폴더: 폴더를 \"찾아보기\"로 고르거나 경로를 직접 입력해 추가하고, 필요 없어진 폴더는 개별적으로 뺄 수 있어요. 폴더마다 따로 다시 스캔하거나 인물 인식을 실행할 수 있어요.\n\n· 새로 추가된 것만 처리: 켜 두면 새로 생긴 사진만 빠르게 처리해요. 끄면 전체를 처음부터 다시 계산하니 사진이 많으면 오래 걸려요. 폴더별 버튼과 전체 버튼 모두에 적용돼요.\n\n· 전체 폴더 다시 스캔 / 인물 인식 전체 실행: 사진을 새로 넣었거나 인물이 제대로 묶이지 않을 때 눌러요.\n\n· 폰에서 사진 가져오기, 위치 기록 가져오기, AI 자동 초안, 파일 내보내기·가져오기도 이 화면에 모여 있어요.\n\n· 데이터 초기화: 모든 폴더의 스캔 결과, 인물 인식 결과, 이름·병합 기록을 지워요. 원본 사진·영상은 지워지지 않지만, 되돌릴 수 없으니 필요하면 먼저 \"내보내기\"로 백업해 두세요."},
    {"anchor_id": "plans", "title": "무료와 구독", "badge": "", "body": "핵심 기능은 계속 무료예요. 사진이 많거나 인생챕터를 더 만들고 싶을 때 구독으로 넓혀 쓰면 돼요.\n\n[무료]\n· 사진·영상 폴더 연결, 시간·장소 기반 자동 이벤트 정리\n· 인물 인식과 인물별 타임라인, 즐겨찾기·검색\n· 관리 사진·영상 5,000개까지, 인생챕터 30개까지\n· 폰 사진 QR 업로드, 백업 파일 내보내기·가져오기\n\n[구독 — 월 3,000원 또는 연 28,000원]\n· 무료 기능 전부 + 5,000개 초과 사진·영상 관리, 31번째 이후 인생챕터\n· 인생챕터 외부 공유(가족·친구에게 링크로 공유), 폰 앱 자동 동기화\n\n한도를 넘어도 이미 올린 사진과 만든 챕터는 언제나 계속 열람할 수 있어요. 새로 추가하는 것만 제한돼요.\n\n구독 상태는 앱을 켤 때와 켜 둔 동안 6시간마다 확인해요. 인터넷이 없어도 마지막으로 확인한 뒤 3일 동안은 구독 상태가 유지돼요. 해지하면 이미 결제한 기간이 끝날 때까지 이용할 수 있어요. 가격·환불 등 자세한 내용은 요금제 페이지와 이용약관에서 확인해 주세요. 구독 관리는 홈페이지의 \"내 계정 > 구독관리\"에서 해요."},
    {"anchor_id": "privacy", "title": "내 사진과 개인정보", "badge": "", "body": "기억숲의 가장 중요한 원칙은 사진·영상 원본을 내 컴퓨터 밖으로 옮기지 않는 거예요.\n\n내 컴퓨터 안에서만 처리되는 것: 사진 분석(날짜·위치·얼굴 인식), 인물 데이터, 썸네일, 영상 만들기.\n\n밖으로 나가는 것(모두 필요할 때만):\n· 장소 이름 찾기: 사진 좌표(숫자)만 OpenStreetMap으로 전달돼요.\n· AI 글 다듬기·초안(선택): 날짜, 지명, 인물 이름, 사진 장수, 내가 쓴 이야기 같은 텍스트만 AI 서비스(Anthropic)로 전달돼요. 사진과 얼굴 데이터는 전송되지 않아요.\n· 인생챕터 외부공유(구독): 내가 공유하기로 한 챕터의 사진만 올라가요.\n· 로그인·구독 확인, 그리고 익명 오류 리포트·이용 통계(사진·파일 경로·계정 정보 제외)가 전송돼요.\n\n자세한 내용은 개인정보처리방침에서 확인할 수 있어요."},
    {"anchor_id": "faq", "title": "자주 묻는 질문 · 문제 해결", "badge": "", "body": "Q. 사진이 갑자기 안 보여요.\n외장하드가 연결돼 있지 않거나 원본 폴더 위치가 바뀌었을 수 있어요. 외장하드를 다시 연결하거나 설정에서 폴더를 다시 등록해 보세요. 로컬 보존해 둔 챕터는 원본이 없어도 보여요.\n\nQ. 스캔이 오래 걸려요.\n처음 스캔과 인물 인식은 사진이 많을수록 시간이 걸려요. 끝날 때까지 앱을 닫지 말고 기다려 주세요. 이후에는 \"새로 추가된 것만 처리\"가 켜져 있으면 빠르게 끝나요.\n\nQ. 인물이 잘못 묶였어요.\n인물 화면에서 같은 사람은 \"합치기\", 다른 사람은 이름을 따로 붙이거나 숨기기로 정리하세요. 그래도 어긋나면 설정에서 \"인물 인식 전체 실행\"을 다시 해 보세요.\n\nQ. 사진 날짜가 이상하게 나와요.\n메신저로 받은 사진처럼 촬영 날짜가 없는 사진은 파일이 만들어진 날짜로 정리될 수 있어요. 사진을 열어 날짜를 직접 수정하거나, 위치 기록을 가져오면 정확도가 올라가요.\n\nQ. 구독했는데 무료로 바뀌었어요.\n인터넷이 3일 넘게 끊겨 구독 확인을 못 한 경우예요. 인터넷에 연결하면 확인되는 즉시 구독 상태로 돌아와요. 로그아웃된 상태에서는 무료로 동작하니 설정에서 로그인 상태도 확인해 보세요.\n\nQ. 문의는 어디로 하나요?\nsupport@gieoksoop.com 으로 연락해 주세요. 앱에서 문제가 생기면 어떤 화면에서 무엇을 눌렀는지 알려 주시면 빨리 도와드릴 수 있어요."},
  ];

  let sections = [];

  async function load() {
    const snap = await getDocs(query(collection(db, 'guides'), orderBy('order', 'asc')));
    sections = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    seedBanner.style.display = sections.length === 0 ? 'block' : 'none';
    render();
  }

  function render() {
    if (sections.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty-row">등록된 섹션이 없어요.</td></tr>`;
      return;
    }
    tbody.innerHTML = sections
      .map(
        (s, i) => `
      <tr draggable="true" data-id="${s.id}">
        <td><span class="drag-handle" title="드래그해서 순서 변경">≡</span>${i + 1}</td>
        <td>${escapeHtml(s.title)}</td>
        <td class="muted">${escapeHtml(s.badge || '-')}</td>
        <td class="muted">#${escapeHtml(s.anchor_id)}</td>
        <td>${s.published === false ? '<span class="pill pill-muted">비공개</span>' : '<span class="pill pill-ok">공개중</span>'}</td>
        <td>
          <button class="btn btn-outline btn-sm" data-edit="${s.id}">수정</button>
          <button class="btn btn-danger btn-sm" data-del="${s.id}">삭제</button>
        </td>
      </tr>`
      )
      .join('');

    tbody.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click', () => openEditor(b.getAttribute('data-edit'))));
    tbody.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => removeSection(b.getAttribute('data-del'))));
    wireDragAndDrop();
  }

  // 순서 열의 ≡ 손잡이를 드래그해서 행을 놓으면, 놓인 자리로 섹션을 옮기고
  // 화면에 보이는 순서 그대로 order 필드를 1,2,3...으로 다시 매겨서 저장한다.
  function wireDragAndDrop() {
    let dragId = null;
    const rows = tbody.querySelectorAll('tr[draggable="true"]');
    rows.forEach((row) => {
      row.addEventListener('dragstart', () => {
        dragId = row.getAttribute('data-id');
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        rows.forEach((r) => r.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (row.getAttribute('data-id') !== dragId) row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', async (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const targetId = row.getAttribute('data-id');
        if (!dragId || dragId === targetId) return;
        await reorder(dragId, targetId);
      });
    });
  }

  async function reorder(srcId, targetId) {
    const srcIdx = sections.findIndex((s) => s.id === srcId);
    const targetIdx = sections.findIndex((s) => s.id === targetId);
    if (srcIdx === -1 || targetIdx === -1) return;
    const next = sections.slice();
    const [moved] = next.splice(srcIdx, 1);
    next.splice(targetIdx, 0, moved);
    sections = next;
    render();
    try {
      await Promise.all(sections.map((s, i) => updateDoc(doc(db, 'guides', s.id), { order: i + 1 })));
    } catch (e) {
      toast('순서를 저장하지 못했어요: ' + (e.message || e), true);
      await load();
    }
  }

  async function removeSection(id) {
    const s = sections.find((x) => x.id === id);
    if (!s) return;
    openModal(`
      <h3>섹션 삭제</h3>
      <p>"${escapeHtml(s.title)}" 섹션을 삭제할까요? 공개 사이트에서도 바로 사라집니다.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">취소</button>
        <button class="btn btn-danger" id="confirmBtn">삭제</button>
      </div>
    `);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('confirmBtn').addEventListener('click', async () => {
      try {
        await deleteDoc(doc(db, 'guides', id));
        closeModal();
        toast('삭제했어요.');
        await load();
      } catch (e) {
        toast('삭제하지 못했어요: ' + (e.message || e), true);
      }
    });
  }

  function openEditor(id) {
    const s = id ? sections.find((x) => x.id === id) : null;
    const isNew = !s;
    openModal(`
      <h3>${isNew ? '새 섹션' : '섹션 수정'}</h3>
      <div class="form-field"><label>제목</label><input type="text" id="fTitle" value="${escapeHtml(s ? s.title : '')}"></div>
      <div class="form-field"><label>앵커 ID (URL의 #뒤에 붙는 값, 영문/숫자/하이픈)</label><input type="text" id="fAnchor" value="${escapeHtml(s ? s.anchor_id : '')}" placeholder="예: new-feature"></div>
      <div class="form-field"><label>배지 문구 (선택, 예: 중요 / 준비 중)</label><input type="text" id="fBadge" value="${escapeHtml(s ? s.badge || '' : '')}"></div>
      <div class="form-field"><label>본문 (문단 사이는 빈 줄로 구분)</label><textarea id="fBody" class="large" rows="16">${escapeHtml(s ? s.body : '')}</textarea></div>
      <div class="form-field">
        <label><input type="checkbox" id="fPublished" ${!s || s.published !== false ? 'checked' : ''} style="width:auto;margin-right:6px;">공개 사이트에 노출</label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="saveBtn">저장</button>
      </div>
    `, { size: 'lg' });
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const title = document.getElementById('fTitle').value.trim();
      const anchor_id = document.getElementById('fAnchor').value.trim().replace(/[^a-zA-Z0-9-]/g, '-');
      const badge = document.getElementById('fBadge').value.trim();
      const body = document.getElementById('fBody').value.trim();
      const published = document.getElementById('fPublished').checked;
      if (!title || !anchor_id || !body) {
        toast('제목, 앵커 ID, 본문은 꼭 채워주세요.', true);
        return;
      }
      try {
        if (isNew) {
          const maxOrder = sections.reduce((m, x) => Math.max(m, x.order || 0), 0);
          await addDoc(collection(db, 'guides'), {
            title, anchor_id, badge, body, published, order: maxOrder + 1,
            updated_at: new Date(), updated_by: uid,
          });
        } else {
          await updateDoc(doc(db, 'guides', s.id), {
            title, anchor_id, badge, body, published,
            updated_at: new Date(), updated_by: uid,
          });
        }
        closeModal();
        toast('저장했어요.');
        await load();
      } catch (e) {
        toast('저장하지 못했어요: ' + (e.message || e), true);
      }
    });
  }

  document.getElementById('addBtn').addEventListener('click', () => openEditor(null));

  // 최신 기본 내용 반영: SEED_SECTIONS(이 파일에 준비된 최신 가이드)를 앵커(#id) 기준으로 Firestore에 합친다.
  //  - 같은 앵커가 있으면 제목·배지·본문을 최신 내용으로 덮어쓰고(게시 여부는 유지),
  //  - 없으면 새 섹션으로 추가하고, 기본 목록에 없는 직접 만든 섹션은 그대로 두되 맨 뒤로 보낸다.
  document.getElementById('syncBtn').addEventListener('click', () => {
    const byAnchor = new Map(sections.map((x) => [x.anchor_id, x]));
    const nUpdate = SEED_SECTIONS.filter((x) => byAnchor.has(x.anchor_id)).length;
    const nAdd = SEED_SECTIONS.length - nUpdate;
    const extras = sections.filter((x) => !SEED_SECTIONS.some((y) => y.anchor_id === x.anchor_id));
    openModal(`
      <h3>최신 기본 내용 반영</h3>
      <p>준비된 최신 가이드(${SEED_SECTIONS.length}개 섹션)를 반영해요.</p>
      <ul style="margin:10px 0 14px 18px;line-height:1.7;">
        <li>새로 추가: <b>${nAdd}</b>개</li>
        <li>같은 앵커(#id)라서 <b>제목·배지·본문을 덮어쓰기</b>: <b>${nUpdate}</b>개 (직접 수정한 내용이 있다면 사라져요)</li>
        <li>직접 만든 섹션 ${extras.length}개는 그대로 두고 맨 뒤로 보내요.</li>
      </ul>
      <p class="form-hint">공개/비공개 상태는 유지돼요. 반영 후에도 섹션별로 수정·순서 변경은 언제든 할 수 있어요.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="confirmBtn">반영하기</button>
      </div>
    `);
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    document.getElementById('confirmBtn').addEventListener('click', async () => {
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = '반영 중...';
      try {
        const stamp = { updated_at: new Date(), updated_by: uid };
        const ops = SEED_SECTIONS.map((sec, i) => {
          const cur = byAnchor.get(sec.anchor_id);
          return cur
            ? updateDoc(doc(db, 'guides', cur.id), { title: sec.title, badge: sec.badge, body: sec.body, order: i + 1, ...stamp })
            : addDoc(collection(db, 'guides'), { ...sec, order: i + 1, published: true, ...stamp });
        });
        extras.forEach((x, k) => ops.push(updateDoc(doc(db, 'guides', x.id), { order: SEED_SECTIONS.length + k + 1 })));
        await Promise.all(ops);
        closeModal();
        toast('최신 가이드를 반영했어요.');
        await load();
      } catch (e) {
        toast('반영하지 못했어요: ' + (e.message || e), true);
        btn.disabled = false;
        btn.textContent = '반영하기';
      }
    });
  });
  document.getElementById('seedBtn').addEventListener('click', async () => {
    const btn = document.getElementById('seedBtn');
    btn.disabled = true;
    btn.textContent = '불러오는 중...';
    try {
      await Promise.all(
        SEED_SECTIONS.map((s, i) =>
          addDoc(collection(db, 'guides'), { ...s, order: i + 1, published: true, updated_at: new Date(), updated_by: uid })
        )
      );
      toast(SEED_SECTIONS.length + '개 섹션을 불러왔어요.');
      await load();
    } catch (e) {
      toast('불러오지 못했어요: ' + (e.message || e), true);
      btn.disabled = false;
      btn.textContent = '기존 콘텐츠 불러오기';
    }
  });

  try {
    await load();
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-row">불러오지 못했어요: ${escapeHtml(e.message || String(e))}</td></tr>`;
  }
</script>

</body>
</html>
